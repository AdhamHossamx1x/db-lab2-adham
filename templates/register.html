{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
  <h1>Create your account</h1>

  <ul id="errors" class="errors">{% for e in errors -%}<li>{{ e }}</li>{%- endfor %}</ul>

  <form id="register-form" class="card form" method="POST" action="{{ url_for('register') }}" novalidate>
    <label for="name">Name</label>
    <input id="name" type="text" name="name" value="{{ name }}" autocomplete="name">

    <label for="email">Email</label>
    <input id="email" type="email" name="email" value="{{ email }}" autocomplete="email">

    <label for="password">Password</label>
    <input id="password" type="password" name="password" autocomplete="new-password">

    <label for="confirm_password">Confirm password</label>
    <input id="confirm_password" type="password" name="confirm_password" autocomplete="new-password">

    <button class="btn btn-primary" type="submit">Register</button>
  </form>

  <p class="note">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
{% endblock %}
