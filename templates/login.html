{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
  <h1>Log in</h1>

  <ul id="errors" class="errors">{% for e in errors -%}<li>{{ e }}</li>{%- endfor %}</ul>

  <form id="login-form" class="card form" method="POST" action="{{ url_for('login') }}" novalidate>
    <label for="email">Email</label>
    <input id="email" type="email" name="email" value="{{ email }}" autocomplete="email">

    <label for="password">Password</label>
    <input id="password" type="password" name="password" autocomplete="current-password">

    <button class="btn btn-primary" type="submit">Log in</button>
  </form>

  <p class="note">No account yet? <a href="{{ url_for('register') }}">Register</a></p>
{% endblock %}
