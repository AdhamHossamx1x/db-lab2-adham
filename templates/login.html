<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in</title>
</head>
<body>
  <h2>Log in</h2>

  <ul id="errors">
    {% for e in errors %}<li>{{ e }}</li>{% endfor %}
  </ul>

  <form id="login-form" method="POST" action="{{ url_for('login') }}" novalidate>
    Email: <input type="email" name="email" value="{{ email }}"><br><br>
    Password: <input type="password" name="password"><br><br>
    <button type="submit">Log in</button>
  </form>

  <p>No account yet? <a href="{{ url_for('register') }}">Register</a></p>

  <script src="{{ url_for('static', filename='validate.js') }}"></script>
</body>
</html>
